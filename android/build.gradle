buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://www.jitpack.io' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath ("com.google.gms:google-services:4.3.15")
    }
}

apply plugin: "com.facebook.react.rootproject"
// Fix: react-native-gesture-handler implicit task dependency issue with Gradle 8.13
gradle.projectsEvaluated {
    subprojects { project ->
        def codegenTask = project.tasks.findByName("generateCodegenArtifactsFromSchema")
        if (codegenTask) {
            project.tasks.configureEach { task ->
                if (task.name == "releaseSourcesJar" || task.name == "debugSourcesJar") {
                    task.dependsOn(codegenTask)
                }
            }
        }
    }
}
