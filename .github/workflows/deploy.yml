name: Kondaas Silent Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Check for Secret
        run: |
          if [ -z "${{ secrets.REVOPUSH_ACCESS_KEY }}" ]; then
            echo "ERROR: REVOPUSH_ACCESS_KEY is EMPTY!"
            exit 1
          else
            echo "Secret is found, proceeding..."
          fi

      - name: Push to Revopush
        env:
          MY_ACCESS_KEY: ${{ secrets.REVOPUSH_ACCESS_KEY }}
        run: |
          # Install the CLI
          npm install -g @revopush/code-push-cli

          # 1. Push to Android (Using the exact name from your dashboard)
          revopush release-react "KondaasApp" android -d Production --accessKey $MY_ACCESS_KEY

          # 2. Push to iOS (Using the exact name we found in your terminal)
          revopush release-react "kondaas-App-iOS" ios -d Production --accessKey $MY_ACCESS_KEY