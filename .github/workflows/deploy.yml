name: Kondaas Silent Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    # Add this to help the Organization recognize the secret
    environment: production 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Check for Secret
        run: |
          if [ -z "${{ secrets.REVOPUSH_ACCESS_KEY }}" ]; then
            echo "ERROR: REVOPUSH_ACCESS_KEY is EMPTY. GitHub cannot find your secret!"
            exit 1
          else
            echo "Secret is found, proceeding..."
          fi

      - name: Push to Revopush
        env:
          # This pulls the secret into a temporary environment variable
          MY_ACCESS_KEY: ${{ secrets.REVOPUSH_ACCESS_KEY }}
        run: |
          npm install -g @revopush/code-push-cli
          
          # We use the variable with a $ sign to ensure it's passed correctly
          revopush release-react "Kondaas App" android -d Production --accessKey $MY_ACCESS_KEY
